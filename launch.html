<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access Gate</title>
    <style>
        body { background: #0a192f; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 20px; }
        .gate-card { background: rgba(255,255,255,0.05); border: 2px solid #D4AF37; padding: 30px; border-radius: 15px; max-width: 400px; width: 100%; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 16px; }
        .btn { background: #D4AF37; color: black; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #launch-area { display: none; }
    </style>
</head>
<body>
<div class="gate-card">
    <div id="reg-form">
        <h2 id="app-title" style="color: #D4AF37;">SECURE ACCESS</h2>
        <p>Register to activate your 3-Month Free Trial.</p>
        <input type="text" id="u-name" placeholder="Full Name" required>
        <input type="tel" id="u-phone" placeholder="WhatsApp Number" required>
        <button class="btn" onclick="register()">1. VERIFY VIA WHATSAPP</button>
    </div>
    <div id="launch-area">
        <h2 style="color: #00ffcc;">✅ VERIFIED</h2>
        <p>Identity received by Sentinel. You may now enter.</p>
        <button class="btn" style="background: #00ffcc;" onclick="launch()">2. OPEN APP NOW</button>
    </div>
</div>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const app = urlParams.get('app') || "Software";
    document.getElementById('app-title').innerText = app.toUpperCase() + " TRIAL";

    function register() {
        const name = document.getElementById('u-name').value;
        const phone = document.getElementById('u-phone').value;
        if(!name || !phone) return alert("Details Required.");
        window.open(`https://wa.me/27847391469?text=Sentinel_Registration: [${app}] ${name} (${phone})`, '_blank');
        document.getElementById('reg-form').style.display = 'none';
        document.getElementById('launch-area').style.display = 'block';
    }

    function launch() {
        const urls = { "sifiso": "https://ais-dev-qtyg5gxbqc32totbygzu6s-66007226743.europe-west2.run.app" };
        window.location.href = urls[app] || "index.html";
    }
</script>
</body>
</html>
