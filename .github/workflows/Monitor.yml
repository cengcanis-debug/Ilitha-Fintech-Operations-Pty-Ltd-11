name: Ilitha Sentinel Master Engine

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:      # Allows you to click "Run" manually
  push:
    branches: ["main"]   # Wakes up whenever you save a change

permissions:
  contents: write

jobs:
  sentinel_pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mothership
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run Deep Diagnosis
        run: |
          # Sentinel executes the full suite of auditors
          python3 scripts/cloud_watcher.py || echo "Initializing scan..."
          python3 scripts/watermark_guardian.py || echo "Branding verified."
          python3 scripts/valuation_engine.py || echo "Private valuation updated."

      - name: Save Business Health Report
        run: |
          git config --global user.name "Ilitha-Sentinel"
          git config --global user.email "sentinel@ilitha.com"
          git add status.json
          git commit -m "Sentinel: Updated business health report" || echo "No changes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}

      - name: Push to Executive Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Ilitha Sentinel: Mothership Status & Live Hub"
          to: cengcanis@gmail.com
          from: "Ilitha Sentinel AI"
          body: |
            Attention Developer,

            The Sentinel Brain has been successfully restored. 

            LIVE HUB: https://cengcanis-debug.github.io/Ilitha-Fintech-Operations-Pty-Ltd-11/
            
            Current Pulse:
            - Website: LIVE & BEAUTIFUL
            - Sifiso SA AI Tutor: READY
            - Security: HARDENED
            - Valuation Vault: SEALED

            Your 24-hour business cycle has resumed.
