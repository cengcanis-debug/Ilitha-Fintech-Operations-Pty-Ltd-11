<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilitha Sentinel | Secure Launch Gate</title>
    <style>
        :root { --blue: #004B8D; --gold: #D4AF37; --bg: #0a192f; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 20px; }
        .gate-card { background: rgba(255,255,255,0.05); border: 2px solid var(--gold); padding: 30px; border-radius: 15px; max-width: 400px; width: 100%; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #334155; background: #1e293b; color: white; }
        .btn-start { background: var(--gold); color: black; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .expired { color: #ff4444; display: none; }
    </style>
</head>
<body>

<div class="gate-card" id="gate-container">
    <div id="active-ui">
        <h2 id="app-name" style="color: var(--gold);">Initializing...</h2>
        <p style="font-size: 13px;">Registration required to access the 3-Month Free Trial.</p>
        <input type="text" id="user-name" placeholder="Full Name (Tokenized)" required>
        <input type="tel" id="user-phone" placeholder="WhatsApp Number" required>
        <button class="btn-start" onclick="executeSentinelLaunch()">REGISTER & LAUNCH APP</button>
    </div>
    
    <div id="expired-ui" class="expired">
        <h2 style="color: #ff4444;">TRIAL PERIOD EXPIRED</h2>
        <p>The free testing phase for this project has concluded.</p>
        <a href="collaborate.html" style="color: var(--gold);">Contact Ilitha for Subscription Details</a>
    </div>
</div>

<script>
    // THE MASTER CLOCK: Set your trial end date here
    const TRIAL_END_DATE = new Date("2026-11-20"); // 3 Months from today
    const urlParams = new URLSearchParams(window.location.search);
    const appType = urlParams.get('app') || "Software";
    const appUrls = {
        "sifiso": "https://ais-dev-qtyg5gxbqc32totbygzu6s-66007226743.europe-west2.run.app",
        "drive": "drive-sim.html",
        "tax": "tax-app.html",
        "tender": "tender-app.html",
        "estate": "estate-app.html"
    };

    document.getElementById('app-name').innerText = appType.toUpperCase() + " ACCESS";

    // Sentinel Kill-Switch Check
    if (new Date() > TRIAL_END_DATE) {
        document.getElementById('active-ui').style.display = 'none';
        document.getElementById('expired-ui').style.display = 'block';
    }

    function executeSentinelLaunch() {
        const name = document.getElementById('user-name').value;
        const phone = document.getElementById('user-phone').value;
        
        if(!name || !phone) return alert("Please complete registration.");

        // 1. WhatsApp Handshake
        const waText = `Sentinel_Registration: [${appType}] User: ${name} (${phone}) verified for trial.`;
        window.open(`https://wa.me/27847391469?text=${encodeURIComponent(waText)}`, '_blank');

        // 2. Open the App
        setTimeout(() => {
            window.location.href = appUrls[appType] || "index.html";
        }, 1000);
    }
</script>
</body>
</html>
