<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilitha | Secure Access Gate</title>
    <style>
        :root { --blue: #004B8D; --gold: #D4AF37; --bg: #0a192f; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 20px; text-align: center; }
        .gate-card { background: rgba(255,255,255,0.05); border: 2px solid var(--gold); padding: 30px; border-radius: 15px; max-width: 400px; width: 100%; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; }
        .btn-action { background: var(--gold); color: black; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .success-area { display: none; }
    </style>
</head>
<body>
<div class="gate-card">
    <div id="registration-form">
        <h2 id="app-title" style="color: var(--gold);">SECURE ACCESS</h2>
        <p style="font-size: 13px;">Sign the register to activate your 3-Month Trial.</p>
        <input type="text" id="user-name" placeholder="Enter Full Name" required>
        <input type="tel" id="user-phone" placeholder="Enter WhatsApp Number" required>
        <button class="btn-action" onclick="registerUser()">1. VERIFY VIA WHATSAPP</button>
    </div>

    <div id="launch-area" class="success-area">
        <h2 style="color: #00ffcc;">✅ VERIFIED</h2>
        <p>Registration received. You can now use the app.</p>
        <button class="btn-action" style="background: #00ffcc;" onclick="finalLaunch()">2. OPEN APP NOW</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const appType = urlParams.get('app') || "software";
    const appUrls = {
        "sifiso": "https://ais-dev-qtyg5gxbqc32totbygzu6s-66007226743.europe-west2.run.app",
        "drive": "https://ais-dev-vgwxccnlwsqpw57xru2voc-66007226743.europe-west2.run.app",
        "tax": "https://cengcanis-debug.github.io/Ilitha-Fintech-Operations-Pty-Ltd-11/tax-app.html",
        "tender": "https://cengcanis-debug.github.io/Ilitha-Fintech-Operations-Pty-Ltd-11/tender-hub.html"
    };

    document.getElementById('app-title').innerText = appType.toUpperCase() + " TRIAL";

    function registerUser() {
        const name = document.getElementById('user-name').value;
        const phone = document.getElementById('user-phone').value;
        if(!name || !phone) return alert("Please fill details.");

        // Step 1: Send WhatsApp lead
        const waText = `Sentinel_Registration: [${appType}] User: ${name} (${phone}) ready for testing.`;
        window.open(`https://wa.me/27847391469?text=${encodeURIComponent(waText)}`, '_blank');

        // Step 2: Change UI to allow Launch
        document.getElementById('registration-form').style.display = 'none';
        document.getElementById('launch-area').style.display = 'block';
    }

    function finalLaunch() {
        window.location.href = appUrls[appType];
    }
</script>
</body>
</html>
