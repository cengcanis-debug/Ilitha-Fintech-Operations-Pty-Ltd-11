<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilitha Sentinel | Secure Launch Gate</title>
    <style>
        :root { --blue: #004B8D; --gold: #D4AF37; --bg: #0a192f; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 20px; text-align: center; }
        .gate-card { background: rgba(255,255,255,0.05); border: 2px solid var(--gold); padding: 30px; border-radius: 15px; max-width: 400px; width: 100%; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #334155; background: #1e293b; color: white; }
        .btn-start { background: var(--gold); color: black; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="gate-card">
    <h2 id="app-name" style="color: var(--gold);">REGISTRATION</h2>
    <p style="font-size: 13px;">Please sign the register to access the 3-Month Free Trial.</p>
    <input type="text" id="user-name" placeholder="Full Name" required>
    <input type="tel" id="user-phone" placeholder="WhatsApp Number" required>
    <button class="btn-start" onclick="executeSentinelLaunch()">REGISTER & START</button>
</div>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const appType = urlParams.get('app') || "Software";
    document.getElementById('app-name').innerText = appType.toUpperCase() + " ACCESS";

    function executeSentinelLaunch() {
        const name = document.getElementById('user-name').value;
        const phone = document.getElementById('user-phone').value;
        if(!name || !phone) return alert("Please complete registration.");

        const waText = `Sentinel_Registration: [${appType}] User: ${name} (${phone}) ready for testing.`;
        window.open(`https://wa.me/27847391469?text=${encodeURIComponent(waText)}`, '_blank');

        setTimeout(() => {
            if(appType === 'sifiso') window.location.href = "https://ais-dev-qtyg5gxbqc32totbygzu6s-66007226743.europe-west2.run.app";
            else window.location.href = "index.html";
        }, 1000);
    }
</script>
</body>
</html>
