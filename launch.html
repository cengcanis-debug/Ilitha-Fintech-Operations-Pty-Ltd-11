<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilitha Sentinel | Secure Access Gate</title>
    <style>
        :root { --blue: #004B8D; --gold: #D4AF37; --bg: #0a192f; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 20px; text-align: center; }
        .gate-card { background: rgba(255,255,255,0.05); border: 2px solid var(--gold); padding: 30px; border-radius: 15px; max-width: 400px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 16px; }
        .btn-action { background: var(--gold); color: black; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 14px; }
        #launch-area { display: none; }
    </style>
</head>
<body>

<div class="gate-card">
    <div id="registration-form">
        <h2 id="app-title" style="color: var(--gold); letter-spacing: 1px;">SECURE ACCESS</h2>
        <p style="font-size: 13px; opacity: 0.8;">Sign the register to activate your 3-Month Trial.</p>
        <input type="text" id="user-name" placeholder="Full Name" required>
        <input type="tel" id="user-phone" placeholder="WhatsApp Number" required>
        <button class="btn-action" onclick="registerUser()">1. VERIFY & SEND SMS</button>
    </div>

    <div id="launch-area">
        <h2 style="color: #00ffcc;">✅ VERIFIED</h2>
        <p style="font-size: 14px;">Lead captured by Sentinel. You may now enter.</p>
        <button class="btn-action" style="background: #00ffcc;" onclick="finalLaunch()">2. OPEN APP NOW</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const appType = urlParams.get('app') || "software";
    
    // THE DELIVERY LINKS: Pointing to the stable Mothership Hub
    const appUrls = {
        "sifiso": "sifiso.html",
        "drive": "drive-sim.html",
        "tax": "tax-app.html",
        "tender": "tender-app.html",
        "estate": "estate-app.html"
    };

    document.getElementById('app-title').innerText = appType.toUpperCase() + " TRIAL";

    function registerUser() {
        const name = document.getElementById('user-name').value;
        const phone = document.getElementById('user-phone').value;
        if(!name || !phone) return alert("Please fill your details.");

        // Step 1: Send the lead to the Director's phone (+27 84 739 1469)
        const waText = `Sentinel_Registration: [${appType}] User: ${name} (${phone}) verified for trial.`;
        window.open(`https://wa.me/27847391469?text=${encodeURIComponent(waText)}`, '_blank');

        // Step 2: Swap the UI to show the "Launch" button
        document.getElementById('registration-form').style.display = 'none';
        document.getElementById('launch-area').style.display = 'block';
    }

    function finalLaunch() {
        // Step 3: Physically deliver the app
        window.location.href = appUrls[appType] || "index.html";
    }
</script>
</body>
</html>
